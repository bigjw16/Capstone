name: patient_med_sync_app
description: Flutter app for patient/hospital auto-load and medication schedule save
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  shared_preferences: ^2.2.3
flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#FBDB6B"

  image: assets/splash/splash.png

  android: true
  ios: true

  android_12:
    color: "#FBDB6B"
    image: assets/splash/splash.png